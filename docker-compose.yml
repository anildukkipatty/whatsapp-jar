services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: jar
      POSTGRES_PASSWORD: jar
      POSTGRES_DB: whatsapp_jar
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jar -d whatsapp_jar"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
